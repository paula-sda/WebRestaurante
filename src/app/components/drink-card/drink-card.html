<div class="drink-card" [routerLink]="['/menu', drink().idDrink]">
  <img
    [src]="drink().strDrinkThumb"
    [alt]="drink().strDrink"
    (error)="drink().local && usePlaceholderImage($event)"
  >
  <div class="drink-info">
    <h3>{{drink().strDrink}}</h3>
    <p>Precio: {{drink().price}} €</p>
    @if (drink().strAlcoholic === 'Alcoholic') {
      <p>Con alcohol</p>
    } @else {
      <p>Sin alcohol</p>
    }
  </div>
</div>
