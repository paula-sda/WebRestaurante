 <section class="hero">
    <div class="hero-content">
    <p class="subtitle">COKTAIL & COFFEE</p>
    <h1>Rouge de Minuit</h1>
    <p class="description">Disfruta de la mejor ambiente de Vitoria Gasteiz.</p>
    <button routerLink="/menu">Ver Menú</button>
  </div>
</section>

<section class="home-reservation">
  <form class="home-reservation-form" (submit)="$event.preventDefault(); reservar()">
    <label>
      Fecha
      <input
        type="date"
        [formField]="reservaForm.fecha"
        >
    </label>

    <label>
            Hora
            <select [formField]="reservaForm.hora">
              @for (hora of horasReserva; track hora) {
                <option [value]="hora">{{ hora }}</option>
              }
            </select>
          </label>

          <label>
            Número de personas
            <select [formField]="reservaForm.personas">
              @for (persona of opcionesPersonas; track persona) {
                <option [value]="persona">
                  {{ persona }} {{ persona === 1 ? 'persona' : 'personas' }}
                </option>
              }
            </select>
          </label>

    <button type="submit">Realizar reserva</button>
  </form>
</section>
