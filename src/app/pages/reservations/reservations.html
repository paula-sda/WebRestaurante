<section class="reservations">
  <section class="reservation-header">
    <h2>Reserva tu mesa</h2>
    <p>Completa tus datos para preparar tu proxima visita</p>


    <div class="reservations-panel">
      <form #reservaForm="ngForm" (ngSubmit)="confirmarReserva(reservaForm)">
        <h2>Datos de la reserva</h2>
        <div class ="form-grid">
          <label>
            Fecha
            <input
              type="date"
              name="fecha"
              [(ngModel)]="fecha"
              [min]="minFecha"
              required>
            @if (fecha && fecha < minFecha) {
              <small class="field-error" role="alert">La fecha no puede ser anterior a hoy.</small>
            }
          </label>
          <label>
            Hora
            <select name="hora" [(ngModel)]="hora" required>
              <option value="18:00">18:00</option>
              <option value="18:30">18:30</option>
              <option value="19:00">19:00</option>
              <option value="19:30">19:30</option>
              <option value="20:00">20:00</option>
              <option value="20:30">20:30</option>
              <option value="21:00">21:00</option>
              <option value="21:30">21:30</option>
            </select>
          </label>

          <label>
            Número de personas
            <select name="personas" [(ngModel)]="personas" required>
              <option [ngValue]="1">1 persona</option>
              <option [ngValue]="2">2 personas</option>
              <option [ngValue]="3">3 personas</option>
              <option [ngValue]="4">4 personas</option>
              <option [ngValue]="5">5 personas</option>
              <option [ngValue]="6">6 personas</option>
            </select>
          </label>
        </div>
        <h2>Datos de contacto</h2>
        <div class="form-grid">
          <label>
            Nombre completo
            <input
              type="text"
              name="nombre"
              [(ngModel)]="nombre"
              minlength="2"
              autocomplete="name"
              required>
          </label>
<!--He utilizado chat para buscar el patron del telefono y del email-->
          <label>
            Correo electrónico
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              #emailCtrl="ngModel"
              pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"
              autocomplete="email"
              required>
            @if (emailCtrl.invalid && emailCtrl.touched) {
              <small>Introduce un correo válido, por ejemplo nombre@dominio.com.</small>
            }
          </label>

          <label>
            Teléfono
            <input
              type="tel"
              name="telefono"
              [(ngModel)]="telefono"
              pattern="[0-9+() -]{9,16}"
              autocomplete="tel"
              required>
          </label>
        </div>
        <button type="submit" [disabled]="reservaForm.invalid || (fecha !== '' && fecha < minFecha) || enviando">
          {{ enviando ? 'Enviando...' : 'Confirmar reserva' }}
        </button>
      </form>

      @if (error){
        <div class="reservation-message error" role="alert">
            {{ error }}
        </div>
      }

      @if (confirmado){
        <div class="reservation-message success" role="status">
          <h2>¡Solicitud completada!</h2>
          <p><strong>Nombre: </strong>{{nombre}}</p>
          <p><strong>Fecha: </strong>{{fecha}}</p>
          <p><strong>Hora: </strong>{{hora}}</p>
          <p><strong>Personas: </strong>{{personas}}</p>
        </div>
      }

  </div>
</section>
